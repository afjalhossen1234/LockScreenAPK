workflows:
  android-workflow:
    name: Build APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper
      - name: Make gradlew executable
        script: |
          chmod +x gradlew
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      
